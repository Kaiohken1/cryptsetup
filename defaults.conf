ENV_SIZE="5G"
ENV_PATH="/var/setup/env.img"
MOUNT_POINT="/mnt/secure_env"
MAPPER_NAME="secure_env"

CIPHER="aes-xts-plain64"
KEY_SIZE="512"
HASH="sha256"

SSH_DIR="$MOUNT_POINT/.ssh"
SSH_CONFIG="$SSH_DIR/config"

GPG_HOME="$MOUNT_POINT/.gnupg"

LOG_FILE="/var/log/secure-env.log"
LOG_LEVEL="INFO"

FILE_PERMS="600"
DIR_PERMS="700"

SECURE_USER="${SUDO_USER:-$USER}"

SYSTEM_SSH_CONFIG="$HOME/.ssh/config"
SYSTEM_GPG_HOME="$HOME/.gnupg"

TEMP_DIR="/tmp"
BATCH_FILE_PREFIX="gpg_batch"

ALIAS_FILE="$MOUNT_POINT/.bashrc"
ALIAS_LINK="$HOME/.secure_env_aliases"

SSH_KEY_TYPE="rsa"
SSH_KEY_BITS="4096"

GPG_KEY_TYPE="RSA"
GPG_KEY_LENGTH="4096"
GPG_SUBKEY_TYPE="RSA"
GPG_SUBKEY_LENGTH="4096"
GPG_EXPIRE_DATE="2y"